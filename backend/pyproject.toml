[project]
name = "wakeful"
version = "0.1.0"
description = "Private AI-assisted Fanvue messaging console (independent implementation)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008", "E501", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
